name: Release Image to Container registry

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      image-name:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      platforms:
        required: true
        type: string
      load:
        required: false
        type: boolean
        default: false
      push:
        required: false
        type: boolean
        default: false
      is-latest:
        required: false
        type: boolean
        default: false
    secrets:
      ghcr-registry-username:
        required: true
      ghcr-registry-password:
        required: true
      docker-registry-username:
        required: true
      docker-registry-password:
        required: true

jobs:

  release:
    runs-on: [self-hosted, ARM64, stable]

    environment: DOCKER_HUB
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ inputs.image-name }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=uv-${{ inputs.python-version }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Log in only when pushing: builds that do not push (pull requests,
      # other branches, Dependabot) may run without the registry secrets.
      - name: Login to GitHub Registry
        if: ${{ inputs.push && github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.ghcr-registry-username }}
          password: ${{ secrets.ghcr-registry-password }}

      - name: Login to Docker Hub Registry
        if: ${{ inputs.push && github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.docker-registry-username }}
          password: ${{ secrets.docker-registry-password }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ inputs.platforms }}
          context: .
          file: ${{ inputs.dockerfile }}
          build-args: |
            PYTHON_VERSION=${{ inputs.python-version }}
          push: ${{ inputs.push && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: ${{ inputs.load }}
