name: Test generated image

on:
  push:
    branches:
      - "6.1.x"
  pull_request:
    branches:
      - "6.1.x"

jobs:

  meta:
    runs-on: ubuntu-latest
    outputs:
      SHA: ${{ steps.vars.outputs.SHA }}
      PLONE_VERSION: ${{ steps.vars.outputs.PLONE_VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute SHA value to be used in building the main image
        id: vars
        run: |
          echo "SHA=sha-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "PLONE_VERSION=$(cat version.txt)" >> $GITHUB_OUTPUT

  test:
    runs-on: ubuntu-latest
    needs:
      - meta
    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Builder Image
        id: meta-builder
        uses: docker/metadata-action@v6
        with:
          images: |
            plone/server-builder
          tags: |
            type=sha

      - name: Prod Config Image
        id: meta-prod-config
        uses: docker/metadata-action@v6
        with:
          images: |
            plone/server-prod-config
          tags: |
            type=sha

      - name: Main Image
        id: meta-main
        uses: docker/metadata-action@v6
        with:
          images: |
            plone/plone-backend
          tags: |
            type=sha

      # No Buildx setup: the default builder uses the docker driver, so each
      # image lands in the local image store and the main image can build
      # FROM the other two without a registry. This keeps the job free of
      # secrets, which pull requests from forks and Dependabot do not get.

      - name: Build builder image for testing
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: Dockerfile.builder
          tags: ${{ steps.meta-builder.outputs.tags }}
          build-args: |
            PLONE_VERSION=${{ needs.meta.outputs.PLONE_VERSION }}

      - name: Build prod-config image for testing
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: Dockerfile.prod
          tags: ${{ steps.meta-prod-config.outputs.tags }}

      - name: Build main image for testing
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: Dockerfile
          tags: ${{ steps.meta-main.outputs.tags }}
          build-args: |
            PLONE_VERSION=${{ needs.meta.outputs.SHA }}

      - name: Test
        run: |
          ./test/run.sh  ${{ steps.meta-main.outputs.tags }}
